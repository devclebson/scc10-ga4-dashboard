<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCC10 — Dashboard</title>
  <meta name="description" content="Dashboard SCC10 conectado ao backend GA4.">
  <link rel="icon" href="portal_scc_10_logo.jpg">
  <script src="node_modules/chart.js/dist/chart.umd.js"></script>
  <script src="node_modules/d3/dist/d3.min.js"></script>
  <script src="node_modules/d3-sankey/dist/d3-sankey.min.js"></script>
  <link rel="stylesheet" href="src/css/app.css">
</head>
<body>
  <div class="toast-container" id="toast-container" aria-live="polite"></div>
  <div class="container" role="main">
    <div id="dashboard-screen">
      <div class="header">
        <div class="header-left">
          <img class="dashboard-logo" src="Logo-SCC10-1-640x170.png" alt="SCC10">
          <span class="badge" id="mode-badge">GA4 BACKEND</span>
          <div id="realtime-badge" class="realtime hidden">
            <span class="realtime-dot"></span>
            <span id="realtime-count">0 leitores agora</span>
          </div>
          <div id="last-updated-text" style="font-size: 12px; color: var(--text-muted);">Atualizado às --:--:--</div>
        </div>

        <div class="dashboard-date-controls" aria-label="Filtro global de período">
          <select id="dashboard-date-range" title="Período dos relatórios">
            <option value="7">7 dias</option>
            <option value="today">Hoje</option>
            <option value="30" selected>30 dias</option>
            <option value="90">90 dias</option>
            <option value="365">12 meses</option>
            <option value="custom">Personalizado</option>
          </select>
          <div id="dashboard-custom-dates" class="dashboard-custom-dates hidden">
            <input id="dashboard-start-date" type="date" aria-label="Data inicial">
            <input id="dashboard-end-date" type="date" aria-label="Data final">
          </div>
          <button id="dashboard-date-apply" class="btn btn-secondary btn-small" type="button">Aplicar</button>
        </div>

        <div class="header-actions">
          <button id="tv-toggle-btn" class="btn btn-tv btn-small" title="Modo TV / Tela Cheia">Modo TV Redação</button>
          <button id="refresh-btn" class="btn btn-secondary btn-small" title="Atualizar agora">Atualizar</button>
          <a class="btn btn-secondary btn-small" href="configuracao.html">Configuração</a>
        </div>
      </div>

      <div class="tabs" id="tabs" role="tablist" aria-label="Seções do Analytics"></div>
      <div id="tab-content" role="tabpanel" aria-live="polite">
        <div id="dashboard-loading" class="dashboard-loading card">
          <div class="loading-spinner" aria-hidden="true"></div>
          <h2>Carregando dados do Analytics</h2>
          <p>O backend está consultando os relatórios históricos e realtime do GA4.</p>
          <small>Esta tela será preenchida assim que os dados estiverem disponíveis.</small>
        </div>
      </div>
    </div>
  </div>
  <script>window.SCC10_API_BASE = window.SCC10_API_BASE || 'http://127.0.0.1:3001';</script>
  <script type="module" src="src/js/app.js?v=backend-session"></script>
</body>
</html>
