<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCC10 — Inicializando</title>
  <meta name="description" content="Inicialização do dashboard SCC10.">
  <link rel="icon" href="assets/images/scc10-mark.jpg">
  <link rel="stylesheet" href="src/css/app.css">
</head>
<body>
  <main class="container" role="main">
    <section class="setup-page-card card bootstrap-card" aria-live="polite">
      <img class="setup-logo" src="assets/images/scc10-logo.png" alt="SCC10">
      <h1>Monitor Editorial SCC10</h1>
      <p id="bootstrap-message" class="setup-description">Verificando a configuração do servidor GA4...</p>
      <div class="bootstrap-progress" aria-hidden="true"><span id="bootstrap-progress-bar"></span></div>
      <div id="bootstrap-status" class="config-status loading">Inicializando</div>
      <a id="bootstrap-config-link" class="btn btn-secondary hidden" href="configuracao.html">Abrir Configuração</a>
    </section>
  </main>
  <script>
    const API_BASE = window.SCC10_API_BASE || 'http://127.0.0.1:3001';
    const message = document.querySelector('#bootstrap-message');
    const status = document.querySelector('#bootstrap-status');
    const progress = document.querySelector('#bootstrap-progress-bar');
    const configLink = document.querySelector('#bootstrap-config-link');

    function showFailure(text) {
      message.textContent = text;
      status.textContent = 'Configuração necessária';
      status.className = 'config-status error';
      progress.style.width = '0%';
      configLink.classList.remove('hidden');
    }

    async function bootstrap() {
      try {
        progress.style.width = '35%';
        const [healthResponse, configResponse] = await Promise.all([
          fetch(`${API_BASE}/api/health`),
          fetch(`${API_BASE}/api/config`)
        ]);
        if (!healthResponse.ok || !configResponse.ok) throw new Error('Backend indisponível.');
        const health = await healthResponse.json();
        const config = await configResponse.json();
        if (!health.ok || !config.configured || !config.propertyId) {
          throw new Error('O servidor GA4 ainda não está configurado.');
        }

        progress.style.width = '60%';
        message.textContent = 'Configuração validada. Consultando dados do Analytics...';
        status.textContent = `GA4 conectado — propriedade ${config.propertyId}`;
        status.className = 'config-status success';
        const reportResponse = await fetch(`${API_BASE}/api/ga4/report`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            propertyId: config.propertyId,
            reportType: 'standard',
            payload: {
              dateRanges: [{ startDate: 'today', endDate: 'today' }],
              dimensions: [{ name: 'date' }],
              metrics: [{ name: 'activeUsers' }],
              limit: 1
            }
          })
        });
        const report = await reportResponse.json();
        if (!reportResponse.ok || report.error) {
          throw new Error(report.error?.message || 'Não foi possível carregar os dados do Analytics.');
        }

        progress.style.width = '85%';
        message.textContent = 'Dados do Analytics disponíveis. Preparando o dashboard...';
        status.textContent = `Dados validados — ${report.rowCount || 0} registro(s) encontrado(s)`;
        await new Promise(resolve => setTimeout(resolve, 700));
        progress.style.width = '100%';
        window.location.replace('dashboard.html');
      } catch (error) {
        showFailure(`${error.message} Redirecionando para a área administrativa.`);
      }
    }

    bootstrap();
  </script>
</body>
</html>
