<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking das Notícias Mais Lidas Agora | SCC10</title>
  <link rel="stylesheet" href="src/css/app.css">
</head>
<body>
  <main class="ranking-test-page">
    <header class="ranking-test-header">
      <a href="dashboard.html" aria-label="Voltar ao Monitor Editorial"><img src="assets/images/scc10-logo.png" class="dashboard-logo" alt="SCC10"></a>
      <div>
        <h1>Ranking das Notícias Mais Lidas Agora</h1>
        <p>Notícias com leitores ativos nos últimos 30 minutos</p>
      </div>
      <a class="btn btn-secondary" href="dashboard.html">← Monitor Editorial</a>
    </header>

    <section class="card">
      <div class="flex-between">
        <div class="section-title">Ranking editorial em tempo real</div>
        <label class="ranking-limit-control">
          <span>Exibir:</span>
          <select id="ranking-limit" class="ranking-limit-select" aria-label="Quantidade de notícias no ranking">
            <option value="10">Top 10</option>
            <option value="20" selected>Top 20</option>
            <option value="50">Top 50</option>
          </select>
        </label>
      </div>
      <p id="ranking-status" class="ranking-test-meta" role="status" aria-live="polite">Carregando última coleta...</p>
      <div class="ranking-container">
        <table class="ranking-table">
          <thead>
            <tr>
              <th style="width:50px;">Pos</th>
              <th>Título da Notícia / URL</th>
              <th style="text-align:right; width:130px;">Leitores (30m)</th>
              <th style="text-align:right; width:120px;">Visualizações</th>
              <th style="text-align:right; width:140px;">% do Total</th>
              <th style="text-align:center; width:110px;">Tendência</th>
            </tr>
          </thead>
          <tbody id="ranking-tbody"><tr><td colspan="6">Carregando ranking...</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <script>window.SCC10_API_BASE = window.SCC10_API_BASE || 'http://127.0.0.1:3001';</script>
  <script type="module" src="src/js/ranking-app.js"></script>
</body>
</html>
